# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repo. Render then asks for the values
# marked "sync: false".
services:
  - type: web
    name: team5-backend
    runtime: docker
    rootDir: backend
    # With rootDir set, Render reads these paths from inside backend/.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    # The live site (Vercel) is built from main, so the backend deploys from
    # main too. Changes reach both together when develop is merged into main.
    branch: main
    # Only deploy once GitHub's tests have passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      # JSON list of the front end's addresses, e.g. ["https://your-site.vercel.app"]
      - key: APP_ALLOWED_ORIGINS
        sync: false
      # Optional pattern for Vercel preview links; leave blank if not needed.
      - key: APP_ALLOWED_ORIGIN_REGEX
        sync: false
      - key: APP_RATE_LIMIT
        value: 10/minute
      # Real visitor address, set by Cloudflare in front of Render. Visitors
      # can't fake it, unlike X-Forwarded-For.
      - key: APP_CLIENT_IP_HEADER
        value: True-Client-IP
